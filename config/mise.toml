[tools]
node = "26.13.1"
yarn = "1"
starship = "latest"
awscli = "latest"
kubectl = "latest"
colima = "latest"
docker-cli = "latest"
docker-compose = "latest"
lima = "latest"

[bootstrap.mise_shell_activate]
zsh = true

[bootstrap.packages]
"apt:gnupg" = "latest"

[bootstrap.services.docker]
state = "running"
enabled = true

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.config/mise/mise.toml" = { mode = "track" }
"~/.zshrc" = { mode = "track" }
"~/.docker/cli-plugins/docker-compose" = { source = "~/.local/share/mise/shims/docker-compose" }
"~/.config/mise/starship/starship.sh" = { mode = "track" }

[tasks."colima:start"]
run='''
	colima start \
	--profile default \
	--activate \
	--arch aarch64 \
	--cpu 10 \
	--disk 100 \
	--memory 24 \
	--mount ${HOME}:w \
	--mount-inotify \
	--ssh-agent \
	--vm-type vz \
	--vz-rosetta \
	--verbose
'''


