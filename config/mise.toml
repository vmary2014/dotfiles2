[tools]
node = "26.13.1"
yarn = "1"
starship = "latest"
awscli = "latest"
kubectl = "latest"
colima = "latest"
docker-cli = "latest"
docker-compose = "latest"
lima = "latest"
gh = "latest"
oh-my-pi = "latest"
telepresence = "latest"
k9s = "latest"

# Neovim / LazyVim
neovim = "latest"
ripgrep = "latest"
fd = "latest"
fzf = "latest"
lazygit = "latest"
tree-sitter = "latest"

# Lua
lua = "latest"
lua-language-server = "latest"
stylua = "latest"

# TypeScript (node is pinned above)
"npm:typescript" = "latest"
"npm:@vtsls/language-server" = "latest"
"npm:@fsouza/prettierd" = "latest"
"npm:eslint_d" = "latest"

# .NET. csharpier/fantomas come from Mason (lazyvim dotnet extra); netcoredbg comes from mise because
# Mason's registry entry points at a release asset that no longer exists upstream.
# The C# language server is Roslyn (driven by seblyng/roslyn.nvim), installed as a dotnet tool.
dotnet = "latest"
"dotnet:roslyn-language-server" = "latest"
"github:Samsung/netcoredbg" = "latest"

[settings]
github.credential_command = "gh auth token"
minimum_release_age = "7d"

[bootstrap.mise_shell_activate]
zsh = true

[bootstrap.packages]
"brew:gnupg" = "latest"
"brew-cask:font-fira-code-nerd-font" = "latest"
"brew-cask:firefox" = { adopt = true }
"brew-cask:ghostty" = { adopt = true }

[bootstrap.services.docker]
state = "running"
enabled = true

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.bashrc/starship" = { line = 'eval "$(starship init bash)"' }

# Ghostty
"~/.config/ghostty/config/font" = { block = '''
font-family = ""
font-family = "FiraCode Nerd Font"
''' }
"~/.config/ghostty/config/nvim-window-nav" = { block = '''
# Send Cmd+h / Cmd+l to the terminal app as CSI-u so Neovim sees <D-h> / <D-l>.
# macOS binds Cmd+h to the "Hide Ghostty" menu item, and Ghostty runs a bound key's menu item before
# its own action. `performable:` skips the menu lookup; `unbind` clears the default Cmd+h first.
keybind = super+h=unbind
keybind = performable:super+h=text:\x1b[104;9u
keybind = performable:super+l=text:\x1b[108;9u
# Cmd+] -> <D-]> : split with the previous buffer. Default Cmd+] is "Select Next Split" (menu item).
keybind = super+]=unbind
keybind = performable:super+]=text:\x1b[93;9u
''' }
"~/.config/mise/dotfiles/starship.toml" = { mode = "track" }
"~/.config/mise/mise.toml" = { mode = "track" }

# Starship
"~/.config/starship.toml/custom" = { source = "dotfiles/starship.toml", merge = true }
"~/.docker/cli-plugins/docker-compose" = { source = "~/.local/share/mise/shims/docker-compose" }
"~/.zshrc" = { mode = "track" }
# Load the prompt in both shells
"~/.zshrc/starship" = { line = 'eval "$(starship init zsh)"' }

# Neovim (LazyVim). Sources live in dotfiles/nvim and are linked file-by-file into
# ~/.config/nvim so that lazy.nvim can write lazy-lock.json / lazyvim.json back to them.
"~/.config/nvim" = { source = "dotfiles/nvim", mode = "symlink-each" }
"~/.config/mise/dotfiles/nvim" = { mode = "track" }

[tasks."colima:start"]
run='''
	colima start \
	--profile default \
	--activate \
	--arch aarch64 \
	--cpu 10 \
	--disk 100 \
	--memory 24 \
	--mount ${HOME}:w \
	--mount-inotify \
	--ssh-agent \
	--vm-type vz \
	--vz-rosetta \
	--verbose
'''

# Create the base file from the preset, only if it doesn't exist yet
[bootstrap.hooks.pre-dotfiles]
description = "Create starship.toml from the bracketed-segments preset"
run = '''
mkdir -p ~/.config
[ -f ~/.config/starship.toml ] || mise exec starship -- starship preset bracketed-segments -o ~/.config/starship.toml
'''

