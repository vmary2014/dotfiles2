[tools]
node = "26.13.1"
yarn = "1"
starship = "latest"
awscli = "latest"
kubectl = "latest"
colima = "latest"
docker-cli = "latest"
docker-compose = "latest"


[bootstrap.mise_shell_activate]
zsh = true

[bootstrap.packages]
"apt:gnupg" = "latest"

[bootstrap.services.docker]
state = "running"
enabled = true

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.config/mise/mise.toml" = { mode = "track" }
"~/.zshrc" = { mode = "track" }

