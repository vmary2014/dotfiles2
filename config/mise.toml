[tools]
node = "26.13.1"
yarn = "1"
starship = "latest"
awscli = "latest"
kubectl = "latest"

[bootstrap.mise_shell_activate]
zsh = true

[botstrap.packages]
"apt:gnupg" = "latest"

[bootstrap.services.mise-history]
builtin = "history-watch"

[dotfiles]
"~/.config/mise/mise.toml" = { mode = "track" }
"~/.zshrc" = { mode = "track" }

